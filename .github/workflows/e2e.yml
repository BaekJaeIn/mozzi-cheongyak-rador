# 수동 실행 또는 main push: 로컬 Supabase(Docker)를 띄워 DB 테스트(pgTAP)와 E2E(Playwright + axe)를 실행한다
name: db-and-e2e

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  db-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: start local Supabase (migrations applied)
        run: supabase start

      - name: DB tests (pgTAP)
        run: supabase test db

      - name: write .env.local for local stack
        run: |
          supabase status -o env > supabase.env
          set -a; . ./supabase.env; set +a
          KEY=$(node -e "console.log(require('node:crypto').randomBytes(32).toString('base64url'))")
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "AMOUNT_ENC_KEY_V1=${KEY}"
            echo "AMOUNT_ENC_KEY_CURRENT=1"
          } > .env.local

      - name: install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: e2e
        run: npm run e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
