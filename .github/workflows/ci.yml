# 매 push·PR: 타입 검사 → 린트 → Deno 검사 → 단위 + 속성 기반 테스트 (NFR-U1-21, PBT-08)
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno check
        run: npm run deno:check

      # PBT seed를 만들어 로그에 남기고 테스트에 넘긴다. 실패하면 이 seed로 로컬 재현:
      #   FC_SEED=<seed> npm test -- <파일>
      - name: choose PBT seed
        id: seed
        run: |
          SEED=$(( (RANDOM << 15 | RANDOM) ))
          echo "PBT seed = $SEED"
          echo "value=$SEED" >> "$GITHUB_OUTPUT"

      - name: unit + property-based tests
        run: npm test
        env:
          FC_SEED: ${{ steps.seed.outputs.value }}
          FC_NUM_RUNS: "200"
